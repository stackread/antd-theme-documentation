# Build and deploy the docs to GitHub Pages.
#
# Installs from the npm registry - the @stackread/* packages must be
# published for this to be green. Pages source must be set to
# "GitHub Actions" once, in the repo settings.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the auth line for GitHub Packages into a runner-level
          # npmrc; the committed .npmrc carries only the scope mapping.
          registry-url: https://npm.pkg.github.com
          scope: '@stackread'
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          DOCS_URL: https://stackread.github.io
          DOCS_BASE_URL: /antd-theme-documentation/
      # The deployed artifact is a different build from the tested one -
      # probe it before it ships (see smoke.mjs).
      - run: npx playwright install --with-deps chromium
      - name: smoke
        # Same env as the build: `serve` loads the config too, and without
        # it would serve at '/' while the built assets live under the
        # project base - every probe URL would hit the 404 page.
        env:
          DOCS_URL: https://stackread.github.io
          DOCS_BASE_URL: /antd-theme-documentation/
        run: |
          npx docusaurus serve --port 3999 --no-open &
          sleep 5
          node smoke.mjs http://localhost:3999/antd-theme-documentation
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
